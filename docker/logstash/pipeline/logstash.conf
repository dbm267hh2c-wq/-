input {
  beats {
    id => "beats"
    port => 5044
  }

  http {
    id => "http-json"
    port => 8081
    codec => json
  }

  tcp {
    id => "tcp-json"
    port => 50000
    codec => json_lines
  }

  file {
    id => "file-logs"
    path => [
      "/usr/share/logstash/logs-in/**/*.log",
      "/usr/share/logstash/logs-in/**/*.json",
      "/usr/share/logstash/logs-in/**/*.ndjson"
    ]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-logs-in"
    codec => "plain"
  }
}

filter {
  mutate {
    add_field => { "[@metadata][pipeline]" => "tdp-dsp" }
  }

  if [message] and [message] =~ /^\s*\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  stdout {
    codec => json_lines
  }

  file {
    path => "/usr/share/logstash/output/events-%{+YYYY.MM.dd}.ndjson"
    codec => json_lines
  }

  # 接入 Elasticsearch 时取消注释，并在 docker-compose 中增加 elasticsearch 服务：
  # elasticsearch {
  #   hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
  #   index => "tdp-dsp-logs-%{+YYYY.MM.dd}"
  # }
}
